name: On-Premise Pipeline

on:
  push:
    branches:
      - main-onprem-hpa
  workflow_dispatch:

jobs:
  on-prem:
    name: On-Premise CI on Self-Hosted Runner
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check/Install Python 3.11
        shell: powershell
        run: |
          $python = Get-Command python3.11 -ErrorAction SilentlyContinue
          if ($python) {
            Write-Host "Python 3.11 is already installed: $(python3.11 --version)"
          } else {
            Write-Host "Python 3.11 not found. Installing with setup-python..."
            "python-version=3.11" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "needs_python_install=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Set up Python
        if: env.needs_python_install == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create and activate virtual environment, install dependencies
        shell: powershell
        working-directory: ./api
        run: |
          if (-Not (Test-Path ".venv")) {
            python -m venv .venv
          }
          .\.venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with pytest
        shell: powershell        
        working-directory: ./api
        run: |
          .\.venv\Scripts\Activate.ps1
          pytest -v ../tests/

      - name: Docker Hub login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker images
        shell: powershell
        run: |
          & "C:\Program Files\Git\bin\bash.exe" "${{ github.workspace }}\push_images.sh"


      - name: Start on-prem cluster
        shell: powershell
        run: |
          & 'C:\Program Files\Git\bin\bash.exe' '${{ github.workspace }}\local_dev.sh' | Tee-Object -Variable scriptOutput
